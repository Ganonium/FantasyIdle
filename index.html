<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142019">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FantasyIdle</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">FantasyIdle <span>Zum Goldenen Amboss · Eichenfurt</span></div>
      <div class="gold" id="gold" title="Gold in der Kasse (am Brett hinterlegtes Kopfgeld in Klammern)">🪙 <b>0</b></div>
      <button id="btn-settings" class="iconbtn" type="button" aria-label="Einstellungen">⚙️</button>
    </header>
    <div id="mats" class="mats"></div>
    <main id="view"></main>
    <nav id="tabs">
      <button data-tab="dorf" type="button"><span>🏰</span>Dorf</button>
      <button data-tab="helden" type="button"><span>⚔️</span>Helden</button>
      <button data-tab="schmiede" type="button"><span>🔨</span>Schmiede</button>
      <button data-tab="laden" type="button"><span>🪙</span>Laden</button>
      <button data-tab="brett" type="button"><span>📜</span>Brett</button>
    </nav>
  </div>
  <div id="modal" hidden><div class="sheet" id="sheet"></div></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
